# 系统配置
system:
  env: 'local'
  addr: 6690

# JWT签名
jwt:
  signing-key: '${JWT_SECRET}'
  expires-time: '24h'
  buffer-time: '1h'
  issuer: 'nucleagent-executor'

# 认证配置
auth:
  provider: 'builtin'

# 权限控制
rbac:
  provider: 'builtin'

# Zap日志配置
zap:
  level: 'info'
  prefix: '[NUCLEAGENT-EXECUTOR]'
  format: 'console'
  director: 'log'
  encode-level: 'LowercaseColorLevelEncoder'
  stacktrace-key: 'stacktrace'
  max-age: 0
  show-line: true
  log-in-console: true

# MySQL配置
mysql:
  host: '${DB_HOST}'
  port: '${DB_PORT}'
  db-name: '${DB_NAME}'
  username: '${DB_USER}'
  password: '${DB_PASSWORD}'
  config: 'charset=utf8mb4&parseTime=True&loc=Local'
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: 'error'
  log-zap: false

# 跨域配置
cors:
  mode: 'strict-whitelist'
  whitelist:
    - allow-origin: '${WEB_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true
    - allow-origin: '${EXECUTOR_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true

# Nucleagent 配置
nucleagent:
  core-url: '${CORE_URL:-http://localhost:6680}'
  data-dir: '${DATA_DIR:-./data}'
  max-sessions: 10
  executor-token: '${EXECUTOR_TOKEN}'   # S2S 携带 X-Executor-Token（注册/心跳/WebSocket，与 core 共享）
  backend: 'opencode'                   # 默认执行后端（opencode / hermes）
  session:
    file: './task_sessions.json'        # TaskSession JSON 持久化文件（session addon 用）

