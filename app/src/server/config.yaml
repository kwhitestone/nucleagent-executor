# 系统配置
system:
  env: 'local'
  addr: 26690

# Zap日志配置
zap:
  level: 'info'
  prefix: '[NUCLEAGENT-EXECUTOR]'
  format: 'console'
  director: 'log'
  encode-level: 'LowercaseColorLevelEncoder'
  stacktrace-key: 'stacktrace'
  max-age: 0
  show-line: true
  log-in-console: true

# 跨域配置
cors:
  mode: 'strict-whitelist'
  whitelist:
    - allow-origin: '${WEB_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true
    - allow-origin: '${EXECUTOR_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true

# Nucleagent 配置
# executor 不连数据库、不暴露 auth 路由；S2S 用 X-Executor-Token，LLM 经 core Proxy。
nucleagent:
  core-url: '${CORE_URL:-http://localhost:26680}'
  data-dir: '${DATA_DIR:-./data}'
  max-sessions: 10
  executor-token: '${EXECUTOR_TOKEN}'   # S2S 携带 X-Executor-Token（注册/心跳/WebSocket，与 core 共享）
  backend: 'hermes'                     # 默认执行后端（hermes / opencode / mock-llm）
  hermes:                               # Hermes Agent 后端配置（backend=hermes 时生效）
    bin: '${HERMES_BIN:-hermes}'        # hermes 可执行文件（容器内 PATH；裸跑指向 venv 的 hermes）
    workdir: '${HERMES_WORKDIR:-./data/hermes}'  # HERMES_HOME（数据/会话目录）
    host: '127.0.0.1'                   # hermes serve 监听 host
    # 下面 provider-id / model 只是**兜底默认值**，不再是唯一真相：
    # 每次执行优先用 core 随请求下发的对话级 key 与 req.Model（用户在 Web 端选定的
    # 模型）。仅当 core 未下发 key 时（旧版 core、或 mock-llm/opencode 后端）才用
    # 这里的值换服务级长效 key。改这里**不会**影响已选定模型的对话。
    provider-id: 2                      # 兜底 provider ID（core DB 里的 LLM provider）
    model: 'glm-5.2'                    # 兜底模型名
  session:
    file: './task_sessions.json'        # TaskSession JSON 持久化文件（session addon 用）
